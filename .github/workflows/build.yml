name: Build FLR Visuals

on:
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract project
    run: |
      mkdir extracted
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Upload the FLR project ZIP to the repository root."
        exit 1
      fi
      unzip -q "$ZIP_FILE" -d extracted
      echo "Extracted: $ZIP_FILE"
      find extracted -maxdepth 3 -name gradlew -print

  - name: Build mod
    run: |
      GRADLEW=$(find extracted -type f -name gradlew -print -quit)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: gradlew not found. The ZIP must contain the complete project."
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLEW")
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: flr-visuals-jar
      path: extracted/**/build/libs/*.jar
      if-no-files-found: error
